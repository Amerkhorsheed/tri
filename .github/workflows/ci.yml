name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check scripts/tri.mjs
      - run: node scripts/test-tri.mjs
      - run: node scripts/test-v3.mjs
      - run: node scripts/test-adapters.mjs
      - run: node scripts/check-consistency.mjs
