<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#68778a" stroke-width="1.6"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#c93a3a" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>
    .box{rx:10;stroke-width:1.5}
    .t{font-size:14px;font-weight:600;fill:#1c2733}
    .s{font-size:11px;fill:#68778a}
    .cmd{font-size:11px;font-family:ui-monospace,Menlo,monospace;fill:#1273e6}
    .edge{fill:none;stroke:#68778a;stroke-width:1.6;marker-end:url(#a)}
  </style>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1c2733">tri — the single-task loop</text>

  <rect class="box" x="24" y="60" width="150" height="64" fill="#eef4fd" stroke="#1273e6"/>
  <text class="t" x="40" y="86">1 · Pick</text>
  <text class="cmd" x="40" y="104">tri next</text>

  <rect class="box" x="214" y="60" width="150" height="64" fill="#fdf3e3" stroke="#e6900f"/>
  <text class="t" x="230" y="86">2 · Claim</text>
  <text class="cmd" x="230" y="104">tri claim T-0042</text>

  <rect class="box" x="404" y="60" width="150" height="64" fill="#f6f7f9" stroke="#8a97a6"/>
  <text class="t" x="420" y="86">3 · Read</text>
  <text class="s" x="420" y="104">task + ADRs + skills</text>

  <rect class="box" x="594" y="60" width="150" height="64" fill="#f6f7f9" stroke="#8a97a6"/>
  <text class="t" x="610" y="86">4 · Implement</text>
  <text class="s" x="610" y="104">one task, no folding</text>

  <rect class="box" x="594" y="188" width="150" height="64" fill="#f6f7f9" stroke="#8a97a6"/>
  <text class="t" x="610" y="214">5 · Evidence</text>
  <text class="s" x="610" y="232">commands + results</text>

  <rect class="box" x="404" y="188" width="150" height="64" fill="#f3edfd" stroke="#7b2ff2"/>
  <text class="t" x="420" y="214">6 · Gate</text>
  <text class="cmd" x="420" y="232">tri validate</text>

  <rect class="box" x="214" y="188" width="150" height="64" fill="#e9f6ee" stroke="#2e9e5b"/>
  <text class="t" x="230" y="214">7 · Done</text>
  <text class="cmd" x="230" y="232">tri done T-0042</text>

  <rect class="box" x="24" y="188" width="150" height="64" fill="#f6f7f9" stroke="#8a97a6"/>
  <text class="t" x="40" y="214">8 · Commit / PR</text>
  <text class="s" x="40" y="232">task ID in message</text>

  <path class="edge" d="M174,92 H210"/>
  <path class="edge" d="M364,92 H400"/>
  <path class="edge" d="M554,92 H590"/>
  <path class="edge" d="M669,124 V184"/>
  <path class="edge" d="M594,220 H558"/>
  <path class="edge" d="M404,220 H368"/>
  <path class="edge" d="M214,220 H178"/>
  <path class="edge" d="M99,188 V128"/>

  <rect class="box" x="24" y="300" width="380" height="70" fill="#fdeeee" stroke="#c93a3a"/>
  <text class="t" x="40" y="326" fill="#c93a3a">Can't decide? Don't.</text>
  <text class="s" x="40" y="344">Owner-level choice → B- entry in DECISIONS.md, task → Blocked.</text>
  <text class="s" x="40" y="360">New work discovered → tri new-task. Never weaken a gate.</text>
  <path d="M480,256 C480,290 430,300 408,310" fill="none" stroke="#c93a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <rect class="box" x="444" y="300" width="392" height="70" fill="#f6f7f9" stroke="#dde3ea"/>
  <text class="t" x="460" y="326">Registers, always</text>
  <text class="s" x="460" y="344">Assumption made → ASSUMPTIONS.md · Decision resolved → D- entry</text>
  <text class="s" x="460" y="360">Architecture changed → ADR first. All append-only.</text>
</svg>
