<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#68778a" stroke-width="1.6"/>
    </marker>
  </defs>
  <style>
    .t{font-size:14px;font-weight:600;fill:#1c2733}
    .s{font-size:11px;fill:#68778a}
    .cmd{font-size:11px;font-family:ui-monospace,Menlo,monospace;fill:#1273e6}
    .edge{fill:none;stroke:#68778a;stroke-width:1.6;marker-end:url(#b)}
  </style>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#1c2733">tri — parallel work, dynamic claims</text>

  <rect x="330" y="58" width="200" height="112" rx="10" fill="#eef4fd" stroke="#1273e6" stroke-width="1.5"/>
  <text class="t" x="348" y="84">Ready frontier</text>
  <text class="s" x="348" y="102">tasks whose deps are Done</text>
  <text class="cmd" x="348" y="122">tri next --json</text>
  <text class="s" x="348" y="142">T-0132 · T-0160 · …</text>

  <rect x="24" y="230" width="220" height="96" rx="10" fill="#fdf3e3" stroke="#e6900f" stroke-width="1.5"/>
  <text class="t" x="40" y="256">Dev A</text>
  <text class="s" x="40" y="274">claims when starting, more when done</text>
  <text class="s" x="40" y="290">fast day = more claims — no ranges,</text>
  <text class="s" x="40" y="306">no pre-assignment, add tasks anytime</text>

  <rect x="320" y="230" width="220" height="96" rx="10" fill="#fdf3e3" stroke="#e6900f" stroke-width="1.5"/>
  <text class="t" x="336" y="256">Dev B</text>
  <text class="s" x="336" y="274">same pull-based protocol; a claim is</text>
  <text class="s" x="336" y="290">a pushed commit (or pushed branch in</text>
  <text class="s" x="336" y="306">branch-pr mode) — git is the lock</text>

  <rect x="616" y="230" width="220" height="96" rx="10" fill="#f3edfd" stroke="#7b2ff2" stroke-width="1.5"/>
  <text class="t" x="632" y="256">/tri:run agent</text>
  <text class="s" x="632" y="274">batch mode: picks scope once, then</text>
  <text class="s" x="632" y="290">loops through gates unattended;</text>
  <text class="s" x="632" y="306">blocked task → B- entry, keeps going</text>

  <path class="edge" d="M330,140 C220,160 160,190 138,226"/>
  <path class="edge" d="M430,170 V226"/>
  <path class="edge" d="M530,140 C640,160 700,190 722,226"/>

  <rect x="24" y="356" width="812" height="54" rx="10" fill="#f6f7f9" stroke="#dde3ea" stroke-width="1.5"/>
  <text class="t" x="40" y="378">Collision? Git decides.</text>
  <text class="s" x="40" y="396">Two claims on one task = push conflict; first push wins, second runs `tri next` and takes another. Claims warn on unmet deps — advisory, never blocking a deliberate split.</text>
</svg>
